server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity_service
          uri: http://localhost:8080
          predicates:
            - Path=${app.api-prefix}/identity/**
          filters:
            - StripPrefix=2

        - id: project_service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}/project/**
          filters:
            - StripPrefix=2

        - id: permission_service
          uri: http://localhost:8082
          predicates:
            - Path=${app.api-prefix}/permission/**
          filters:
            - StripPrefix=2

        - id: issue_service
          uri: http://localhost:8083
          predicates:
            - Path=${app.api-prefix}/issue/**
          filters:
            - StripPrefix=2

  main:
    web-application-type: reactive